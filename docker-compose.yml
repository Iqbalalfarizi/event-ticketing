# version: '3.8'
services:
  #MySQL Database (Port 3306)
  mysql-ticket:
    image: mysql:8.0
    container_name: mysql-ticket
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_DB_PASS}
      MYSQL_DATABASE: ${MYSQL_DB_TICKET}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "3307:3306"
    volumes:
      - mysql_ticket_data:/var/lib/mysql
  #Redis Cache (Port 6379)
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
  event-tix-service:
    build: ./services/eventtix-service
    container_name: eventtix-service
    ports:
      - "3000:3000"
    env_file:
      - ./services/eventtix-service/.env
    command: npm run dev
    depends_on:
      mysql-ticket:
        condition: service_healthy
      redis:
        condition: service_started
  mysql-booking:
    image: mysql:8.0
    container_name: mysql-booking
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_DB_PASS}
      MYSQL_DATABASE: ${MYSQL_DB_BOOKING}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "3308:3306"
    volumes:
    - mysql_booking_data:/var/lib/mysql
  booking-tix-service:
    build: ./services/bookingtix-service
    container_name: bookingtix-service
    ports:
      - "3001:3001"
    env_file:
      - ./services/bookingtix-service/.env
    command: npm run dev
    depends_on:
      mysql-booking:
        condition: service_healthy
      kafka:
        condition: service_started
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  notification-worker: 
    build: ./services/notification-service
    container_name: notification-worker
    depends_on:
      - kafka
      - mongo
    
volumes:
  mysql_ticket_data:
  mysql_booking_data:
  redis_data:
  mongo_data:

