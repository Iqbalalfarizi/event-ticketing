version: '3.8'
services:
  #MySQL Database (Port 3306)
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_DB_PASS}
      MYSQL_DATABASE: ${MYSQL_DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  #Redis Cache (Port 6379)
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  event-tix-service:
    build: ./services/eventtix-service
    container_name: eventtix-service
    ports:
      - "3000:3000"
    env_file:
      - ./services/eventtix-service/.env
    command: npm run dev
    depends_on:
      - mysql
      - redis
volumes:
  mysql_data:
  redis_data:
