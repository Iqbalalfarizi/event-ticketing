version: '3.8'
services:
  #MySQL Database (Port 3306)
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_DB_PASS}
      MYSQL_DATABASE: ${MYSQL_DB_NAME}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  #Redis Cache (Port 6379)
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  event-tix-service:
    build: ./services/eventtix-service
    container_name: eventtix-service
    ports:
      - "3000:3000"
    env_file:
      - ./services/eventtix-service/.env
    command: npm run dev
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
volumes:
  mysql_data:
  redis_data:
